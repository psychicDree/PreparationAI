# mlx-lm LoRA config for the PreparationAI interviewer model.
# Sized for an 8 GB Apple Silicon Mac: 4-bit base (QLoRA), batch 1, gradient checkpointing.
model: "mlx-community/Llama-3.2-1B-Instruct-4bit"
train: true
fine_tune_type: lora
data: "data"
adapter_path: "adapters"

# Learn only the assistant reply (the JSON questions/feedback), not the prompt.
mask_prompt: true

num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
iters: 600
learning_rate: 1e-4
max_seq_length: 2048
grad_checkpoint: true

steps_per_report: 20
steps_per_eval: 100
val_batches: 20
save_every: 200
seed: 42

lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.05
