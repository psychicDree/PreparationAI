apiVersion: v1
kind: Namespace
metadata:
  name: preparation-ai
  labels:
    name: preparation-ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: preparation-ai-config
  namespace: preparation-ai
data:
  NODE_ENV: "production"
  PORT: "8080"
  DB_NAME: "preparation_ai"
  DB_USER: "preparation_ai"
  DB_PORT: "5432"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: preparation-ai-secrets
  namespace: preparation-ai
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  DB_PASSWORD: cGFzc3dvcmQ=  # password
  JWT_SECRET: dGVzdC1zZWNyZXQ=  # test-secret
  OPENAI_API_KEY: dGVzdC1rZXk=  # test-key
  STRIPE_SECRET_KEY: c2tfdGVzdF9mYWtl  # sk_test_fake
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preparation-ai-backend
  namespace: preparation-ai
  labels:
    app: preparation-ai-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: preparation-ai-backend
  template:
    metadata:
      labels:
        app: preparation-ai-backend
    spec:
      containers:
      - name: preparation-ai-backend
        image: preparation-ai:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: REDIS_HOST
          value: "redis-service"
        envFrom:
        - configMapRef:
            name: preparation-ai-config
        - secretRef:
            name: preparation-ai-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: preparation-ai-backend-service
  namespace: preparation-ai
spec:
  selector:
    app: preparation-ai-backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: preparation-ai
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "preparation_ai"
        - name: POSTGRES_USER
          value: "preparation_ai"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: preparation-ai-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: postgres-init
        configMap:
          name: postgres-init-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: preparation-ai
spec:
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: preparation-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: preparation-ai
data:
  init.sql: |
    -- Database initialization script
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    -- Add your schema here
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: preparation-ai
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: preparation-ai
spec:
  selector:
    app: redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: preparation-ai-ingress
  namespace: preparation-ai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: preparation-ai.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: preparation-ai-backend-service
            port:
              number: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: preparation-ai-hpa
  namespace: preparation-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: preparation-ai-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80